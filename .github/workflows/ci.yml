name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
      - name: Use pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          cache: true
          version: 11
      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test
